name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/filmcraft-android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264"

      - name: Point cargo at the NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      # A throwaway key so the release APK is installable on a phone. For a Play Store build,
      # replace this step with a keystore stored in repository secrets.
      - name: Create signing key
        run: |
          keytool -genkey -v -keystore "$RUNNER_TEMP/filmcraft.keystore" -storepass android -keypass android \
            -alias filmcraft -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FilmCraft CI"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/filmcraft.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build APK
        run: cargo apk build -p filmcraft-android --lib --release

      - name: Collect APK
        run: |
          mkdir -p dist
          cp target/release/apk/*.apk dist/FilmCraft-${{ github.sha }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
